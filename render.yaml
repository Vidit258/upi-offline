services:
  - type: web
    name: upi-offline-mesh
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: upi-mesh-db
          property: jdbcConnectionString

databases:
  - name: upi-mesh-db
    plan: free
    databaseName: upimesh
    user: upimesh
