# ─── Production Profile: PostgreSQL ──────────────────────────────────────────
# Activated when SPRING_PROFILES_ACTIVE=prod
# All values are read from environment variables injected by Render/Railway/Docker.

spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 'update' creates tables on first boot, then preserves data across restarts.
# Use 'validate' once the schema is stable.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 console must be disabled in production
spring.h2.console.enabled=false

# Logging
logging.level.com.demo.upimesh=INFO
