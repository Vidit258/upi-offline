# ─── Production Profile: PostgreSQL ──────────────────────────────────────────
# Activated when SPRING_PROFILES_ACTIVE=prod
# DATABASE_URL is injected by Render as a jdbc:postgresql://... connection string
# (using the jdbcConnectionString property from the database resource in render.yaml)

spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# Let Hibernate auto-detect dialect from the JDBC driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 'update' creates tables on first boot, then preserves data across restarts
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 console must be disabled in production
spring.h2.console.enabled=false

# Logging
logging.level.com.demo.upimesh=INFO
